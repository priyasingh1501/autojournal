<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap');

  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #02060E;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .orb1 {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, #0929AD, transparent 70%);
    top: -200px; left: -100px;
    filter: blur(80px);
    opacity: 0.25;
  }
  .orb2 {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a4a8a, transparent 70%);
    bottom: -100px; right: -80px;
    filter: blur(80px);
    opacity: 0.2;
  }

  .content {
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(152, 212, 250, 0.7);
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 72px;
    font-weight: 400;
    line-height: 1.1;
    color: rgba(224, 242, 254, 0.95);
    margin-bottom: 0;
  }

  h1 em {
    color: rgba(152, 212, 250, 0.95);
    font-style: italic;
  }

  .sub {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: rgba(180, 210, 240, 0.5);
    margin-top: 20px;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  <div class="content">
    <div class="eyebrow">Voice Journaling · AI Insights · Ancient Wisdom</div>
    <h1>Think out loud.<br>Understand yourself.<br><em>Live untangled.</em></h1>
    <div class="sub">The guide in your pocket for when life feels unclear.</div>
  </div>
</body>
</html>
